name: CI Checks

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: Check code formatting
        run: |
          uvx --from air-formatter air format . --check

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.5.3
          use-public-rspm: true

      - name: Install package
        run: |
          # pinned to version https://github.com/A2-ai/rv/releases/tag/v0.23.1
          curl -sSL https://raw.githubusercontent.com/A2-ai/rv/c641020c3d52ad7c1e28e41f7c5337879d363db1/scripts/install.sh | bash
          rv sync

      - name: Test code
        run: |
          Rscript -e "devtools::test(pkg='httkqsprs')"

      - name: Check package build
        run: |
          Rscript -e "devtools::check(pkg='httkqsprs')"
